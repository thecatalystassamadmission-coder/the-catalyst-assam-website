<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Monthly Class Routine - The Catalyst Assam</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* ======================================================== */
        /* PREMIUM GLOW THEME - EXACT MATCH WITH INDEX.HTML         */
        /* ======================================================== */
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body { 
            width: 100%; 
            max-width: 100vw; 
            overflow-x: hidden !important; 
        }
        
        /* 100% SAME BACKGROUND AS INDEX.HTML */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #8C00FF 0%, #7132CA 33%, #9929EA 66%, #C47BE4 100%) !important;
            background-attachment: fixed !important;
            color: #ffffff; 
        }
        
        /* HEADER EXACT MATCH WITH INDEX.HTML */
        header { 
            background-color: rgba(113, 50, 202, 0.85); /* #7132CA */
            backdrop-filter: blur(12px);
            text-align: center; 
            padding: 25px 15px; 
            border-bottom: 3px solid #D8FF00; /* Neon Lime Border */
            box-shadow: 0 5px 25px rgba(216, 255, 0, 0.3); 
            position: sticky; top: 0; z-index: 100;
            width: 100%; 
        }
        
        .logo-img { 
            width: 70px; height: 70px; border-radius: 50%; 
            border: 3px solid #D8FF00; 
            vertical-align: middle; margin-right: 15px; object-fit: cover; 
            background-color: white; 
            box-shadow: 0 0 20px rgba(216, 255, 0, 0.5); 
        }
        
        .title-wrapper {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
        }

        header h1 { 
            margin: 0; 
            font-size: 2.2rem; 
            text-transform: uppercase; 
            text-shadow: 0 0 10px rgba(255,255,255,0.5); 
            white-space: nowrap; 
        }
        
        .subtitle { 
            display: flex; justify-content: space-between; width: 100%;
            margin: 5px 0 0 0; color: #D8FF00; font-weight: 900; font-size: 0.9rem;
            text-shadow: 0 0 10px rgba(216,255,0,0.5); 
        }

        .header-subtext {
            letter-spacing: 5px; font-weight: bold; margin-top: 15px; 
            color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.5);
            text-transform: uppercase;
        }

        /* Container & Titles */
        .container { padding: 40px 15px; max-width: 1600px; margin: auto; text-align: center; min-height: 100vh; }
        
        h2.main-title { 
            color: #D8FF00; text-decoration: none; margin-bottom: 20px; 
            text-transform: uppercase; font-size: 2rem; 
            text-shadow: 0 0 15px rgba(216,255,0,0.6); 
            border-bottom: 2px dashed #D8FF00; display: inline-block; padding-bottom: 10px;
        }

        /* Current Date Display */
        .current-date-info {
            text-align: center; font-size: 1.2rem; font-weight: bold; color: #fff;
            background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 8px;
            border: 1px dashed #D8FF00; display: inline-block; margin: 0 auto 30px auto;
        }

        /* 🔥 PREMIUM CATEGORY TABS (Like Admission/Attendance Buttons) 🔥 */
        .category-tabs { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 30px; justify-content: center; }
        .cat-tab-btn { 
            background: rgba(113, 50, 202, 0.6); 
            color: #fff; 
            border: 2px solid #D8FF00; 
            padding: 12px 25px; 
            border-radius: 30px; /* Pill Shape */
            font-weight: 900; 
            cursor: pointer; 
            transition: 0.3s; 
            font-size: 0.95rem; 
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(216,255,0,0.2);
        }
        .cat-tab-btn:hover { 
            background: #ffffff; 
            color: #000; 
            border-color: #ffffff; 
            box-shadow: 0 0 25px rgba(255,255,255,0.8); 
            transform: scale(1.05);
        }
        .cat-tab-btn.active { 
            background: #D8FF00; 
            color: #000; 
            border-color: #D8FF00; 
            box-shadow: 0 0 25px rgba(216,255,0,0.8); 
            transform: scale(1.05);
        }

        /* LIVE ROUTINE TABLE (EXCEL-LIKE) */
        .table-container {
            width: 100%; overflow-x: auto; margin-bottom: 30px;
            background: rgba(28, 9, 54, 0.6); border: 3px solid #D8FF00; 
            border-radius: 15px; box-shadow: 0 0 25px rgba(216,255,0,0.4);
            backdrop-filter: blur(10px);
        }
        
        .routine-table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        .routine-table th, .routine-table td { 
            border: 1px solid rgba(216,255,0,0.3); padding: 15px; 
            text-align: center; color: #fff; font-size: 1.1rem;
        }
        .routine-table th { 
            background: rgba(113, 50, 202, 0.8); color: #D8FF00; 
            font-weight: 900; text-transform: uppercase; text-shadow: 0 0 5px #000;
        }
        
        /* 🔥 PREMIUM EVERYDAY BADGE (Monday, Tuesday etc.) 🔥 */
        .routine-table td:first-child { width: 160px; padding: 10px; }
        .day-badge {
            background: linear-gradient(135deg, #8C00FF 0%, #7132CA 100%);
            color: #fff;
            border: 2px solid #D8FF00;
            padding: 12px 10px;
            border-radius: 30px; /* Pill Shape */
            font-weight: 900;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(216,255,0,0.4);
            width: 100%;
            display: block;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }
        
        .routine-table td { background: transparent; transition: 0.2s; font-weight: bold; min-width: 150px; }
        .routine-table tr:hover td { background: rgba(153, 41, 234, 0.4); }
        .routine-table tr:hover td:first-child { background: transparent; } /* Ensure badge doesn't get awkward hover background */
        
        /* Edit Inputs (Admin Only) */
        .cell-input {
            width: 100%; min-height: 40px; background: transparent; border: 1px dashed transparent;
            color: #fff; font-weight: bold; font-size: 1.1rem; text-align: center;
            outline: none; padding: 5px; transition: 0.3s;
        }
        /* Time slot inputs header row */
        th .cell-input { color: #D8FF00; font-weight: 900; }
        .cell-input:focus, .cell-input:hover { border-bottom: 1px dashed #D8FF00; background: rgba(0,0,0,0.3); }

        /* Admin Controls */
        .admin-controls { display: none; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .admin-btn { 
            background: #D8FF00; color: #000; padding: 12px 25px; font-weight: 900;
            border: none; border-radius: 30px; font-size: 1rem; cursor: pointer;
            box-shadow: 0 0 15px rgba(216,255,0,0.5); transition: 0.3s; text-transform: uppercase;
        }
        .admin-btn:hover { background: #fff; transform: scale(1.05); }

        /* BACK BUTTON */
        .back-btn {
            display: inline-flex; align-items: center; justify-content: center; 
            background: rgba(153, 41, 234, 0.4); 
            padding: 15px 35px; margin-top: 20px; margin-bottom: 20px;
            border-radius: 40px; border: 2px solid #D8FF00; color: #D8FF00; 
            font-weight: 900; font-size: 1.1rem; transition: 0.3s; 
            text-decoration: none; text-transform: uppercase;
            box-shadow: 0 0 25px rgba(216,255,0,0.3); 
            backdrop-filter: blur(5px);
        }
        .back-btn:hover { background-color: #D8FF00; color: #000; box-shadow: 0 0 35px rgba(216,255,0,0.7); transform: scale(1.05); }

        /* FOOTER & LOGIN MODAL */
        footer { 
            text-align: center; background-color: #7132CA; 
            color: white; margin-top: 40px; width: 100%; 
            border-top: 2px solid rgba(216,255,0,0.4); 
            box-shadow: 0 -10px 30px rgba(216,255,0,0.1);
        }
        .loc-box { 
            background: rgba(140, 0, 255, 0.5); padding: 20px; 
            font-size: 1.2rem; font-weight: bold; text-transform: uppercase; 
            color: #D8FF00; text-shadow: 0 0 10px rgba(216,255,0,0.5);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px;
        }
        .login-trigger { color: #fff; font-size: 0.8rem; cursor: pointer; text-decoration: underline; background: none; border: none; font-weight: bold;}

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 999999; }
        .login-box { background: rgba(0,0,0,0.8); padding: 40px; border-radius: 20px; border: 2px solid #D8FF00; box-shadow: 0 0 30px rgba(216,255,0,0.4); text-align: center; width: 90%; max-width: 400px; position: relative;}
        .login-box h2 { color: #D8FF00; margin-bottom: 20px; text-transform: uppercase; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 2px solid #C47BE4; background: rgba(255,255,255,0.9); font-size: 1rem; font-weight: bold; }
        .close-modal { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #D8FF00; font-size: 1.5rem; font-weight: bold; cursor: pointer;}
        
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999999; justify-content: center; align-items: center; flex-direction: column; color: #D8FF00; text-align: center;}

        @media (max-width: 600px) { 
            header h1 { font-size: 1.6rem; } 
            .subtitle { font-size: 0.7rem; }
            .cat-tab-btn { font-size: 0.8rem; padding: 10px 15px; }
            h2.main-title { font-size: 1.5rem; }
            .routine-table th, .routine-table td { padding: 10px 5px; font-size: 0.95rem; min-width: 120px;}
            .routine-table td:first-child { min-width: 120px; font-size: 0.8rem;}
            .day-badge { padding: 10px 5px; }
        }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div style="font-size: 4rem; margin-bottom: 10px; animation: bounce-vertical 1s infinite;">🚀</div>
        <h2 style="color:#D8FF00; text-shadow:0 0 15px rgba(216,255,0,0.8);">Syncing...</h2>
    </div>

    <div id="login-modal" class="modal-overlay">
        <div class="login-box">
            <button class="close-modal" onclick="document.getElementById('login-modal').style.display='none'">X</button>
            <h2>Admin Login</h2>
            <input type="email" id="admin-email" class="login-input" placeholder="Email Address">
            <input type="password" id="admin-pass" class="login-input" placeholder="Password">
            <button class="admin-btn" style="width: 100%;" onclick="adminLogin()">LOGIN</button>
            <p id="login-error" style="color: #ff4444; margin-top: 10px; display: none; font-weight: bold;">Wrong Credentials!</p>
        </div>
    </div>

    <header>
        <img src="logo.png" alt="Logo" class="logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135810.png'">
        <div class="title-wrapper">
            <h1>THE CATALYST ASSAM</h1>
            <div class="subtitle">
                <span>S</span><span>H</span><span>A</span><span>P</span><span>I</span><span>N</span><span>G</span>
                <span style="opacity: 0;">_</span> <span>T</span><span>A</span><span>L</span><span>E</span><span>N</span><span>T</span>
            </div>
        </div>
        <div class="header-subtext">LIVE WEEKLY ROUTINE</div>
    </header>

    <div class="container">
        <h2 class="main-title">LIVE CLASS SCHEDULE</h2>
        
        <div class="current-date-info" id="system-date-display">
            Loading Date...
        </div>

        <div class="category-tabs" id="tabs-container">
            </div>

        <div class="table-container">
            <table class="routine-table" id="routine-table">
                <thead>
                    <tr id="table-head-row">
                        </tr>
                </thead>
                <tbody id="table-body">
                    </tbody>
            </table>
        </div>

        <div class="admin-controls" id="admin-controls">
            <button class="admin-btn" style="background: #00ff00;" onclick="saveRoutine()">💾 SAVE ROUTINE</button>
        </div>

        <br><a href="index.html" class="back-btn">⬅ BACK TO HOME</a>
    </div>

    <footer>
        <div class="loc-box">
            <span>📍 MAYONG BAZAR, RAJAMAYONG, MORIGAON (ASSAM) 782411</span>
            <button class="login-trigger" id="login-trigger-btn" onclick="document.getElementById('login-modal').style.display='flex'">Admin Edit</button>
        </div>
    </footer>

    <script>
        // 🔥 FIREBASE INITIALIZATION
        const firebaseConfig = {
            apiKey: "AIzaSyC8ocSx1TcmnAtDzwUx82HW6SYd7hLCszc",
            authDomain: "the-catalyst-assam-payment.firebaseapp.com",
            databaseURL: "https://the-catalyst-assam-payment-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "the-catalyst-assam-payment",
            storageBucket: "the-catalyst-assam-payment.firebasestorage.app",
            messagingSenderId: "256883795397",
            appId: "1:256883795397:web:9c55da88762ce2293157ac"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const DB_PATH = "live_routines_v2"; // Changed path for new structure

        const CATEGORIES = [
            "Class 6", "Class 7", "Class 8", "Class 9", "Class 10", 
            "Class 11", "Class 12", "🎓 Degree Courses", "🎯 Competitive Exams"
        ];
        
        const DAYS = ["MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY", "SUNDAY"];
        const NUM_SLOTS = 7; // 7 Time slots columns

        let routineData = {};
        let activeTab = CATEGORIES[0];
        let isAdmin = false;

        // Current Date
        const MONTHS_NAMES = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
        let sysDate = new Date();
        let sysDay = sysDate.getDate();
        let sysMonthIndex = sysDate.getMonth();
        let sysYear = sysDate.getFullYear();

        // On Load
        window.onload = function() {
            document.getElementById('system-date-display').innerText = `Today: ${sysDay} ${MONTHS_NAMES[sysMonthIndex]} ${sysYear}`;
            if(localStorage.getItem("routineAdminLoggedIn") === "true") {
                isAdmin = true;
                document.getElementById('login-trigger-btn').innerText = "Logout Admin";
                document.getElementById('login-trigger-btn').onclick = adminLogout;
            }
            renderTabs();
            fetchRoutineData();
        };

        // Admin Auth
        function adminLogin() {
            let email = document.getElementById('admin-email').value.trim();
            let pass = document.getElementById('admin-pass').value.trim();
            
            // 🔥 NEW PASSWORD
            if(email === "thecatalystassam@gmail.com" && pass === "thecatalystassam19472026routine") {
                localStorage.setItem("routineAdminLoggedIn", "true");
                isAdmin = true;
                document.getElementById('login-modal').style.display = 'none';
                document.getElementById('login-trigger-btn').innerText = "Logout Admin";
                document.getElementById('login-trigger-btn').onclick = adminLogout;
                renderTable(); // Re-render to show inputs
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function adminLogout() {
            localStorage.removeItem("routineAdminLoggedIn");
            isAdmin = false;
            document.getElementById('login-trigger-btn').innerText = "Admin Edit";
            document.getElementById('login-trigger-btn').onclick = () => { document.getElementById('login-modal').style.display='flex'; };
            renderTable(); // Re-render to remove inputs
        }

        // Fetch Live Data
        function fetchRoutineData() {
            document.getElementById('loading-overlay').style.display = 'flex';
            database.ref(DB_PATH).on('value', (snapshot) => {
                routineData = snapshot.val() || {};
                // Initialize missing categories
                CATEGORIES.forEach(cat => {
                    if(!routineData[cat]) {
                        routineData[cat] = {
                            headers: Array(NUM_SLOTS).fill(""), // 7 Slot Headers
                            daysData: {} // Data for Mon-Sun
                        };
                        DAYS.forEach(day => {
                            routineData[cat].daysData[day] = Array(NUM_SLOTS).fill("");
                        });
                    }
                });
                renderTable();
                document.getElementById('loading-overlay').style.display = 'none';
            });
        }

        function renderTabs() {
            const container = document.getElementById('tabs-container');
            container.innerHTML = "";
            CATEGORIES.forEach(cat => {
                let btn = document.createElement('button');
                btn.className = `cat-tab-btn ${activeTab === cat ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    activeTab = cat;
                    renderTabs();
                    renderTable();
                };
                container.appendChild(btn);
            });
        }

        // Generate Fixed Grid Table
        function renderTable() {
            const tHeadRow = document.getElementById('table-head-row');
            const tbody = document.getElementById('table-body');
            
            let data = routineData[activeTab];
            if(!data) return; // Failsafe
            
            // 1. Render Header
            tHeadRow.innerHTML = "<th>DAY / TIME</th>";
            for(let i=0; i<NUM_SLOTS; i++) {
                let th = document.createElement('th');
                let slotVal = data.headers[i] || `TIME SLOT ${i+1}`;
                if(isAdmin) {
                    th.innerHTML = `<input type="text" class="cell-input" value="${data.headers[i] || ''}" placeholder="Time Slot ${i+1}" id="header-input-${i}">`;
                } else {
                    th.innerText = slotVal;
                }
                tHeadRow.appendChild(th);
            }

            // 2. Render 7 Days Rows
            tbody.innerHTML = "";
            document.getElementById('admin-controls').style.display = isAdmin ? 'flex' : 'none';

            DAYS.forEach(day => {
                let tr = document.createElement('tr');
                
                // First column (Day name styled as premium badge)
                let tdDay = document.createElement('td');
                tdDay.innerHTML = `<div class="day-badge">${day}</div>`;
                tr.appendChild(tdDay);

                // 7 Data columns for this day
                let dayArr = data.daysData[day] || Array(NUM_SLOTS).fill("");
                
                for(let i=0; i<NUM_SLOTS; i++) {
                    let td = document.createElement('td');
                    if(isAdmin) {
                        td.innerHTML = `<input type="text" class="cell-input" value="${dayArr[i] || ''}" id="cell-${day}-${i}">`;
                    } else {
                        td.innerText = dayArr[i] || '-';
                        if(dayArr[i]) td.style.color = "#ffffff";
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            });
        }

        // Save Routine to Firebase
        function saveRoutine() {
            let newHeaders = [];
            for(let i=0; i<NUM_SLOTS; i++) {
                newHeaders.push(document.getElementById(`header-input-${i}`).value.trim());
            }

            let newDaysData = {};
            DAYS.forEach(day => {
                newDaysData[day] = [];
                for(let i=0; i<NUM_SLOTS; i++) {
                    newDaysData[day].push(document.getElementById(`cell-${day}-${i}`).value.trim());
                }
            });

            routineData[activeTab] = {
                headers: newHeaders,
                daysData: newDaysData
            };

            document.getElementById('loading-overlay').style.display = 'flex';
            database.ref(DB_PATH + '/' + activeTab).set(routineData[activeTab])
                .then(() => {
                    document.getElementById('loading-overlay').style.display = 'none';
                    alert(`✅ Routine for ${activeTab} saved successfully!`);
                })
                .catch(err => {
                    document.getElementById('loading-overlay').style.display = 'none';
                    alert("❌ Error saving routine. Check your internet.");
                });
        }
    </script>
</body>
</html>
