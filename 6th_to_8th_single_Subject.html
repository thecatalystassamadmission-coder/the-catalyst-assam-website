<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Subjects - The Catalyst Assam</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: url('world-map-png-30718.png') no-repeat center center fixed; background-size: cover; margin: 0; padding: 0; }
        header { background-color: #1a0066; color: white; text-align: center; padding: 20px; border-bottom: 5px solid yellow; }
        .container { display: flex; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; background: rgba(255,255,255,0.9); }
        .page-title { background: red; color: yellow; padding: 15px; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; border: 2px solid #1a0066; }
        
        .grid-container { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; width: 100%; max-width: 900px; }
        .card { background: white; border: 3px solid #1a0066; border-radius: 15px; width: 350px; padding: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); text-align: center; transition: opacity 0.3s; }
        .card-header { font-size: 1.3rem; font-weight: bold; color: white; padding: 10px; margin: -20px -20px 20px -20px; border-radius: 12px 12px 0 0; }
        
        .subject-box { text-align: left; margin: 15px 0; }
        .checkbox-label { display: block; font-size: 1.1rem; margin: 8px 0; font-weight: bold; cursor: pointer; }
        input[type="checkbox"] { width: 20px; height: 20px; margin-right: 10px; accent-color: red; }

        .fee-display { background: #ffffcc; padding: 10px; border: 2px dashed red; margin-top: 15px; font-weight: bold; color: #1a0066; }
        .apply-btn { display: block; width: 100%; background: #1a0066; color: white; padding: 12px; margin-top: 15px; text-decoration: none; font-weight: bold; border-radius: 30px; text-transform: uppercase; }
        .apply-btn:hover { background: red; }

        /* Faded / Hidden Class */
        .faded { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body>

    <header><h1>THE CATALYST ASSAM</h1><p>SHAPING TALENT</p></header>
    <div class="container">
        <div class="page-title">6TH TO 8TH SINGLE SUBJECT</div>

        <div class="grid-container">
            
            <div class="card" id="card-assamese">
                <div class="card-header" style="background: #1a0066; border-bottom: 4px solid yellow;">ASSAMESE MEDIUM</div>
                <p style="color:red; font-weight:bold;">Tick Marks Select Subjects:</p>
                
                <div class="subject-box">
                    <label class="checkbox-label"><input type="checkbox" class="sub-assamese" value="MATHS" onclick="calcFees('Assamese')"> MATHS</label>
                    <label class="checkbox-label"><input type="checkbox" class="sub-assamese" value="SCIENCE" onclick="calcFees('Assamese')"> SCIENCE</label>
                    <label class="checkbox-label"><input type="checkbox" class="sub-assamese" value="ENGLISH" onclick="calcFees('Assamese')"> ENGLISH</label>
                    <label class="checkbox-label"><input type="checkbox" class="sub-assamese" value="SOCIAL SCIENCE" onclick="calcFees('Assamese')"> SOCIAL SCIENCE</label>
                </div>

                <div id="fee-box-assamese" class="fee-display">Select subjects to see fees</div>
                <a id="btn-assamese" href="#" class="apply-btn" style="pointer-events: none; opacity: 0.5;">Select Subjects First</a>
            </div>

            <div class="card" id="card-english">
                <div class="card-header" style="background: #006600; border-bottom: 4px solid orange;">ENGLISH MEDIUM</div>
                <p style="color:red; font-weight:bold;">Tick Marks Select Subjects:</p>
                
                <div class="subject-box">
                    <label class="checkbox-label"><input type="checkbox" class="sub-english" value="MATHS" onclick="calcFees('English')"> MATHS</label>
                    <label class="checkbox-label"><input type="checkbox" class="sub-english" value="SCIENCE" onclick="calcFees('English')"> SCIENCE</label>
                    <label class="checkbox-label"><input type="checkbox" class="sub-english" value="ENGLISH" onclick="calcFees('English')"> ENGLISH</label>
                    <label class="checkbox-label"><input type="checkbox" class="sub-english" value="SOCIAL SCIENCE" onclick="calcFees('English')"> SOCIAL SCIENCE</label>
                </div>

                <div id="fee-box-english" class="fee-display">Select subjects to see fees</div>
                <a id="btn-english" href="#" class="apply-btn" style="pointer-events: none; opacity: 0.5;">Select Subjects First</a>
            </div>

        </div>
        <a href="admission_menu.html" style="margin-top:30px; font-weight:bold; color:red; border:2px solid red; padding:10px 20px; background:white; text-decoration:none; border-radius:20px;">⬅ BACK TO MENU</a>
    </div>

    <script>
        function calcFees(medium) {
            let checkboxes = document.querySelectorAll(medium === 'Assamese' ? '.sub-assamese:checked' : '.sub-english:checked');
            let count = checkboxes.length;
            
            // Logic to Disable the OTHER card
            let cardAssamese = document.getElementById('card-assamese');
            let cardEnglish = document.getElementById('card-english');

            if (medium === 'Assamese') {
                if (count > 0) {
                    cardEnglish.classList.add('faded'); // English medium gayeb/disable
                } else {
                    cardEnglish.classList.remove('faded'); // Wapas aa jayega agar uncheck kiya
                }
            } else {
                if (count > 0) {
                    cardAssamese.classList.add('faded'); // Assamese medium gayeb/disable
                } else {
                    cardAssamese.classList.remove('faded'); // Wapas aa jayega
                }
            }

            let subjects = [];
            checkboxes.forEach(cb => subjects.push(cb.value));

            let admFee = 0, monFee = 0;
            if(count === 1) { admFee = 450; monFee = 350; }
            else if(count === 2) { admFee = 800; monFee = 700; }
            else if(count === 3) { admFee = 1150; monFee = 1050; }
            else if(count === 4) { admFee = 1500; monFee = 1400; }

            let displayBox = document.getElementById(medium === 'Assamese' ? 'fee-box-assamese' : 'fee-box-english');
            let btn = document.getElementById(medium === 'Assamese' ? 'btn-assamese' : 'btn-english');

            if (count > 0) {
                displayBox.innerHTML = `Admsn: ₹${admFee} | Mon: ₹${monFee}<br><small style="color:red;">(1st Month Free)</small>`;
                // Link Generate Logic
                let url = `6th_to_8th_single_Subject_admission.html?medium=${medium}&subjects=${subjects.join(',')}&adm=${admFee}&mon=${monFee}`;
                btn.href = url;
                btn.style.pointerEvents = "auto";
                btn.style.opacity = "1";
                btn.innerHTML = "APPLY NOW ➡";
            } else {
                displayBox.innerHTML = "Select subjects to see fees";
                btn.style.pointerEvents = "none";
                btn.style.opacity = "0.5";
                btn.innerHTML = "Select Subjects First";
            }
        }
    </script>
</body>
</html>
